# =============================================================================
# Railway — konfigurasi build & deploy untuk service "app"
# (MySQL ditambahkan terpisah sebagai plugin/database di project Railway)
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# CMD image sudah berisi entrypoint orkestrasi; tidak perlu startCommand khusus.
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
